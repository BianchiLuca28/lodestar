# Fake persona settings. Copy the folder to config/ and edit.
locale: it
currency: EUR
timezone: Europe/Rome

llm:
  # OpenAI-compatible endpoint (Ollama by default). In Docker: http://host.docker.internal:11434
  base_url: http://127.0.0.1:11434

# One model per task; swap freely and compare with `make eval`.
models:
  parse: qwen3:8b
  chat: qwen3:8b
  vision: null # chosen in v0.4
  embed: bge-m3

ledger:
  adjustment_category: ❓ Varie # balance-check adjustments (Rettifica)

portfolio:
  trade_account: Broker Orsa # where trades settle; change when you add a broker

# Read only by the one-time spreadsheet import (XLSX loader).
initial_import:
  asset_classes: # the sheet's "Asset" label → class and bucket; other labels are skipped
    ETF Monetario: { asset_class: money_market_etf, bucket: P2 }
    Titolo di Stato: { asset_class: govt_bond, bucket: P3 }
    ETF Azionario: { asset_class: equity_etf, bucket: P4 }
  adjustment: # the realignment the plan asks for before tracking started
    date: 2026-03-01
    amount: 1234.56
    account: Banca Aurora
    direction: in
    category: ❓ Varie
    note: Riallineamento saldi

backup:
  schedule: daily
  targets:
    - kind: folder
      path: backups # under the data dir; an absolute path also works
      enabled: true
    - kind: s3
      bucket: lodestar-backup-example
      region: eu-south-1
      enabled: false

notifications:
  telegram: false
  digest_day: 1 # monthly digest on day 1
  quiet_hours: ["22:00", "08:00"]
