services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Ollama runs natively on the Windows host, outside Docker.
      LODESTAR_LLM_BASE_URL: http://host.docker.internal:11434
      LODESTAR_CONFIG_DIR: /app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config
      - ./data:/app/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
