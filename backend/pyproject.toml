[project]
name = "lodestar"
version = "0.0.1"
description = "Local-first, AI-assisted personal finance tracker"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lodestar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "lodestar.domain.*"
strict = true
